name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Fast feedback: the DuckDB-independent core, compiled and tested in seconds.
  core-test:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -f core.Makefile core_test
      - run: make -f core.Makefile frontend_check

  # DuckDB's shared extension pipeline: builds the extension on every native platform DuckDB
  # distributes for and runs test/sql where the pipeline can: its test phase (extension-ci-tools,
  # scripts/ci_phase.py) skips linux_arm64 and osx_amd64 and runs everywhere else, the musl builds,
  # windows_arm64 and MinGW included. The community extension repository requires all of them.
  # It builds the three WebAssembly targets too (docs/DESIGN.md section 21): wasm_eh and wasm_threads are
  # what DuckDB-WASM 2.0 loads (its base and threads bundles); wasm_mvp has no 2.0 bundle to load into
  # but the community repository builds it. The pipeline does not test them; wasm-test below does.
  #   Pull requests run the pipeline's reduced matrix (linux_amd64, windows_amd64, wasm_eh) and opt into
  #   nothing else, to keep them cheap. Pushes to main and manual runs (workflow_dispatch, which also
  #   works on a branch) build every platform, with one failing platform not cancelling the others.
  #   opt_in_archs: the platforms DuckDB's matrix leaves out unless asked for (opt-ins override reduced mode).
  # Artifacts: this job is the only one in the repository that uploads any. Each platform uploads
  # sketchbook-<duckdb_version>-extension-<platform> holding sketchbook.duckdb_extension (.wasm for the
  # wasm targets). On the platforms the pipeline tests, extension-ci-tools also puts
  # test-support/<id>/test-support.tar.gz (DuckDB's shell, unittest and libduckdb) in the same artifact
  # (scripts/ci_phase.py, upload). Only skip_tests turns that off, so pull requests keep it and builds of
  # main strip it afterwards (strip-test-support, at the end of this file). The jobs below read only
  # the extension files. The docs workflow's upload-pages-artifact is the Pages deployment.
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.1
      ci_tools_version: v2.0-cyanoptera
      extension_name: sketchbook
      opt_in_archs: ${{ github.event_name != 'pull_request' && 'linux_amd64_musl;linux_arm64_musl;osx_amd64;windows_arm64' || '' }}
      reduced_ci_mode: ${{ github.event_name == 'pull_request' && 'enabled' || 'disabled' }}

  # The size of each platform's extension, raw and as distributed (gzip), in the run's summary.
  # A loadable extension links all of DuckDB statically, so most of it is DuckDB
  # (docs/DESIGN.md, "Building for every platform"). Fails if no extension was found, so a renamed
  # artifact cannot leave the table empty unnoticed.
  extension-sizes:
    name: Extension sizes
    needs: duckdb-stable-build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sketchbook-*-extension-*
          path: artifacts
      - name: Report sizes
        run: |
          set -euo pipefail
          mkdir -p artifacts
          files=$(find artifacts -name 'sketchbook.duckdb_extension*' -type f | sort)
          if [ -z "$files" ]; then
            echo "::error::No sketchbook-*-extension-* artifact holds a sketchbook.duckdb_extension"
            exit 1
          fi
          {
            echo "| Platform | Extension (bytes) | gzip -9 (bytes) |"
            echo "|---|--:|--:|"
            while read -r file; do
              platform=$(basename "$(dirname "$file")" | sed 's/^sketchbook-[^-]*-extension-//')
              echo "| $platform | $(stat -c %s "$file") | $(gzip -9c "$file" | wc -c) |"
            done <<< "$files"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # test/sql runs with the extension linked into DuckDB's test runner, so the shipped file is never
  # loaded there. This loads the stripped linux_amd64 build into a stock DuckDB (the Python package)
  # and runs the notebook functions, then checks the editor server's HTTP API and its token, Host and
  # Origin gates (test/ci/test_loadable.py).
  loadable-test:
    name: Loadable extension and server API
    needs: duckdb-stable-build
    # Also when another platform's build failed: what this checks was built (the download fails if not).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sketchbook-v2.0.1-extension-linux_amd64
          path: artifacts/linux_amd64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb==2.0.1
      - run: python test/ci/test_loadable.py artifacts/linux_amd64/sketchbook.duckdb_extension

  # The pipeline does not test wasm builds, so this loads the wasm_eh and wasm_threads artifacts
  # into DuckDB-WASM 2.0 in headless Chromium and runs the notebook functions (test/wasm).
  wasm-test:
    name: Extension in DuckDB-WASM
    needs: duckdb-stable-build
    # Also when another platform's build failed: what this checks was built (the download fails if not).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sketchbook-v2.0.1-extension-wasm_eh
          path: build/wasm_eh/extension/sketchbook
      # Pull requests build wasm_eh only (the reduced matrix above).
      - uses: actions/download-artifact@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: sketchbook-v2.0.1-extension-wasm_threads
          path: build/wasm_threads/extension/sketchbook
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install DuckDB-WASM and Playwright
        working-directory: test/wasm
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: node test/wasm/run.cjs wasm_eh ${{ github.event_name != 'pull_request' && 'wasm_threads' || '' }}

  # Builds of main publish only the extension binaries. The shared distribution
  # workflow also puts test-support/<id>/test-support.tar.gz (DuckDB shell,
  # unittest, libduckdb) into each tested platform's artifact, and its only
  # switch for that is skip_tests. So once every job that reads the artifacts
  # has finished, re-upload them without it. Pull requests keep the bundle.
  list-main-artifacts:
    name: List main-branch extension artifacts
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [duckdb-stable-build, extension-sizes, loadable-test, wasm-test]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          names=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | contains("-extension-")) | .name' \
            | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "Extension artifacts: $names"

  strip-test-support:
    name: Strip test-support (${{ matrix.name }})
    needs: list-main-artifacts
    if: ${{ !cancelled() && needs.list-main-artifacts.outputs.names != '' && needs.list-main-artifacts.outputs.names != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.list-main-artifacts.outputs.names) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifact
      - id: strip
        run: |
          if [ -d artifact/test-support ]; then
            rm -rf artifact/test-support
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          find artifact -type f
          if ! find artifact -type f -name '*.duckdb_extension*' | grep -q .; then
            echo "::error::no extension binary in ${{ matrix.name }}"
            exit 1
          fi
      - if: ${{ steps.strip.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifact
          overwrite: true
          if-no-files-found: error

  # Pushing a v* tag builds every platform (above) and publishes a GitHub
  # release with one extension binary per platform attached. Only the
  # *.duckdb_extension(.wasm) files are attached; test-support is never
  # published. Release notes are generated from the merged pull requests.
  release:
    name: Publish release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.duckdb-stable-build.result == 'success' && needs.loadable-test.result == 'success' && needs.wasm-test.result == 'success' }}
    needs: [duckdb-stable-build, loadable-test, wasm-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-extension-*'
          path: artifacts
      - name: Collect extension binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for dir in artifacts/*-extension-*; do
            platform="${dir##*-extension-}"
            for file in "$dir"/*.duckdb_extension "$dir"/*.duckdb_extension.wasm; do
              [ -f "$file" ] || continue
              base="$(basename "$file")"
              name="${base%%.*}"
              suffix="${base#"$name"}"
              cp "$file" "dist/${name}-${TAG}-${platform}${suffix}"
            done
          done
          ls -l dist
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::no extension binaries to release"
            exit 1
          fi
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
